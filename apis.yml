name: Trivago
description: >-
  trivago (trivago N.V.) is a global hotel and accommodation metasearch engine,
  founded in Düsseldorf, Germany in 2005, that aggregates prices, ratings, and
  reviews from 250+ booking sites across more than 7 million properties in 190
  countries and 31 languages. trivago does not hold inventory — its role is to
  surface the full competitive market and connect travelers to the best available
  deal, including member, loyalty, and direct-hotel rates that individual booking
  platforms do not show by default. For programmatic access, trivago is AI-native:
  it publishes a public, no-auth Model Context Protocol (MCP) connector exposing a
  search_hotels tool, an invite-only direct hotel-search API, and a partner
  Connectivity Suite (FastConnect for real-time rates and availability, plus a
  Conversion Tracking API). It also operates trivago Hotel Manager (Business
  Studio) for hoteliers.
